<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shorksi | Socials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #08080a;
      --surface:      #0c0c0e;
      --raised:       #131316;
      --border:       #242428;
      --text:         #efeff1;
      --muted:        #a1a1aa;
      --purple:       #9147ff;
      --purple-light: #bf94ff;
      --green:        #1db954;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 64px;
    }

    .container { max-width: 480px; width: 100%; }

    /* ── Header ── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .avatar-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 0;
      border: 2px solid var(--purple);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 14px;
      height: 14px;
      border-radius: 0;
      border: 2px solid var(--bg);
      background: #3d3d3d;
    }
    .status-badge.online  { background: #3ba55d; }
    .status-badge.idle    { background: #faa61a; }
    .status-badge.dnd     { background: #ed4245; }
    .status-badge.offline { background: #3d3d3d; }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 16px 20px;
      margin-bottom: 8px;
    }

    .card-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .card-label i { font-size: 13px; }
    .card-label > span {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
    }

    .discord-icon-color { color: #5865f2; }
    .spotify-icon-color { color: var(--green); }

    /* equalizer bars */
    @keyframes eq {
      0%, 100% { transform: scaleY(0.35); }
      50%       { transform: scaleY(1);   }
    }
    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
      margin-left: 2px;
    }
    .eq-bars span {
      display: block;
      width: 2.5px;
      border-radius: 0;
      background: var(--green);
      transform-origin: bottom;
    }
    .eq-bars span:nth-child(1) { height: 55%;  animation: eq 0.7s 0.00s ease-in-out infinite; }
    .eq-bars span:nth-child(2) { height: 100%; animation: eq 0.7s 0.15s ease-in-out infinite; }
    .eq-bars span:nth-child(3) { height: 70%;  animation: eq 0.7s 0.30s ease-in-out infinite; }

    /* activity row */
    .activity-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--raised);
      border-radius: 0;
    }
    .activity-img {
      width: 40px;
      height: 40px;
      border-radius: 0;
      background: rgba(145,71,255,0.12);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .activity-img img { width: 100%; height: 100%; object-fit: cover; }
    .activity-text { flex: 1; min-width: 0; }
    .activity-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .activity-detail {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .status-only { font-size: 12px; color: var(--muted); }

    /* ── Spotify card ── */
    #spotifyCard {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-bottom: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, max-height 0.35s ease, padding 0.3s ease, margin 0.3s ease;
    }
    #spotifyCard.visible {
      opacity: 1;
      max-height: 160px;
      padding: 16px 20px;
      margin-bottom: 8px;
      pointer-events: auto;
    }

    .spotify-body {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .album-art {
      width: 52px;
      height: 52px;
      border-radius: 0;
      background: rgba(29,185,84,0.1);
      overflow: hidden;
      flex-shrink: 0;
    }
    .album-art img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .spotify-open-btn {
      margin-left: auto;
      color: var(--muted);
      font-size: 10px;
      text-decoration: none;
      padding: 3px 7px;
      border-radius: 0;
      border: 1px solid var(--border);
      transition: color 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
    }
    .spotify-open-btn:hover {
      color: var(--green);
      border-color: rgba(29,185,84,0.4);
    }

    .spotify-info { flex: 1; min-width: 0; }
    .song-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
      margin-bottom: 8px;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .progress-time {
      font-size: 10px;
      color: var(--muted);
      min-width: 28px;
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      flex: 1;
      height: 2px;
      background: var(--border);
      border-radius: 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 0;
      transition: width 1s linear;
      width: 0%;
    }

    /* ── Link buttons ── */
    .links { display: flex; flex-direction: column; gap: 6px; }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 11px 14px;
      text-decoration: none;
      color: var(--text);
      font-family: inherit;
      font-weight: 500;
      font-size: 13px;
      transition: border-color 0.2s, background 0.2s;
    }
    .link-btn:hover {
      border-color: var(--purple);
      background: var(--raised);
    }

    .link-icon {
      width: 28px;
      height: 28px;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .chevron {
      margin-left: auto;
      color: var(--muted);
      font-size: 10px;
      transition: color 0.2s;
    }
    .link-btn:hover .chevron { color: var(--purple-light); }

    .ic-twitch    { background: rgba(145,71,255,0.15);  color: #9147ff; }
    .ic-youtube   { background: rgba(255,0,0,0.12);     color: #ff4444; }
    .ic-tiktok    { background: rgba(255,255,255,0.06); color: #e8e8e8; }
    .ic-instagram { background: rgba(228,64,95,0.15);   color: #e4405f; }
    .ic-discord   { background: rgba(88,101,242,0.15);  color: #5865f2; }
    .ic-osu       { background: rgba(255,102,171,0.15); color: #ff66ab; }

    .osu-svg { width: 15px; height: 15px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--raised); }
    ::-webkit-scrollbar-thumb { background: #3a3a3d; border-radius: 0; }

    @media (max-width: 480px) {
      body { padding: 24px 16px 48px; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="avatar-wrap">
      <div class="avatar" id="avatar">S</div>
      <div class="status-badge offline" id="statusBadge"></div>
    </div>
    <h1>Shorksi</h1>
  </div>

  <!-- Discord card -->
  <div class="card" id="discordCard">
    <div class="card-label">
      <i class="fa-brands fa-discord discord-icon-color"></i>
      <span>Discord Status</span>
    </div>
    <div id="discordBody">
      <p class="status-only">Laden…</p>
    </div>
  </div>

  <!-- Spotify card -->
  <div class="card" id="spotifyCard">
    <div class="card-label">
      <i class="fa-brands fa-spotify spotify-icon-color"></i>
      <span>Listening to Spotify</span>
      <div class="eq-bars">
        <span></span><span></span><span></span>
      </div>
      <a id="spotifyLink" href="#" target="_blank" rel="noopener noreferrer" class="spotify-open-btn" title="Auf Spotify öffnen">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </a>
    </div>
    <div class="spotify-body">
      <a id="albumArtLink" href="#" target="_blank" rel="noopener noreferrer" class="album-art" style="text-decoration:none;">
        <img id="albumArt" src="" alt="Album Art">
      </a>
      <div class="spotify-info">
        <div class="song-name"   id="songName"></div>
        <div class="song-artist" id="songArtist"></div>
        <div class="progress-row">
          <span class="progress-time" id="pCurrent">0:00</span>
          <div class="progress-track">
            <div class="progress-fill" id="pFill"></div>
          </div>
          <span class="progress-time" id="pTotal">0:00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Links -->
  <div class="links">
    <a class="link-btn" href="https://twitch.tv/shorksi" target="_blank" rel="noopener noreferrer">
      <div class="link-icon ic-twitch"><i class="fa-brands fa-twitch"></i></div>
      <span>Twitch</span>
      <i class="fa-solid fa-chevron-right chevron"></i>
    </a>
    <a class="link-btn" href="https://youtube.com/@shorksi" target="_blank" rel="noopener noreferrer">
      <div class="link-icon ic-youtube"><i class="fa-brands fa-youtube"></i></div>
      <span>YouTube</span>
      <i class="fa-solid fa-chevron-right chevron"></i>
    </a>
    <a class="link-btn" href="https://tiktok.com/@shorksi" target="_blank" rel="noopener noreferrer">
      <div class="link-icon ic-tiktok"><i class="fa-brands fa-tiktok"></i></div>
      <span>TikTok</span>
      <i class="fa-solid fa-chevron-right chevron"></i>
    </a>
    <a class="link-btn" href="https://instagram.com/shorksii" target="_blank" rel="noopener noreferrer">
      <div class="link-icon ic-instagram"><i class="fa-brands fa-instagram"></i></div>
      <span>Instagram</span>
      <i class="fa-solid fa-chevron-right chevron"></i>
    </a>
    <a class="link-btn" href="https://discord.gg/KmBzTEQ2UM" target="_blank" rel="noopener noreferrer">
      <div class="link-icon ic-discord"><i class="fa-brands fa-discord"></i></div>
      <span>Discord</span>
      <i class="fa-solid fa-chevron-right chevron"></i>
    </a>
    <a class="link-btn" href="https://osu.ppy.sh/users/shorksi" target="_blank" rel="noopener noreferrer">
      <div class="link-icon ic-osu">
        <svg class="osu-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="3.5"/>
          <circle cx="16" cy="16" r="5.5" fill="currentColor"/>
        </svg>
      </div>
      <span>osu!</span>
      <i class="fa-solid fa-chevron-right chevron"></i>
    </a>
  </div>

</div>

<script>
  const DISCORD_USER_ID = '327418252659785738';

  const $ = id => document.getElementById(id);

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmt(ms) {
    const s = Math.floor(Math.abs(ms) / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  let spotify   = null;
  let progTimer = null;
  let ws        = null;
  let hbTimer   = null;

  function tickProgress() {
    if (!spotify?.timestamps) return;
    const now = Date.now();
    const dur = spotify.timestamps.end - spotify.timestamps.start;
    const ela = Math.min(now - spotify.timestamps.start, dur);
    $('pFill').style.width    = (dur > 0 ? (ela / dur) * 100 : 0) + '%';
    $('pCurrent').textContent = fmt(ela);
    $('pTotal').textContent   = fmt(dur);
  }

  function renderSpotify(data) {
    const card = $('spotifyCard');
    if (!data) {
      spotify = null;
      card.classList.remove('visible');
      clearInterval(progTimer);
      return;
    }
    spotify = data;
    card.classList.add('visible');
    $('songName').textContent   = data.song;
    $('songArtist').textContent = data.artist;
    if (data.album_art_url) $('albumArt').src = data.album_art_url;
    const trackUrl = data.track_id ? `https://open.spotify.com/track/${data.track_id}` : '#';
    $('spotifyLink').href  = trackUrl;
    $('albumArtLink').href = trackUrl;
    clearInterval(progTimer);
    tickProgress();
    progTimer = setInterval(tickProgress, 1000);
  }

  function renderPresence(d) {
    const dot = $('statusBadge');
    dot.className = 'status-badge ' + (d.discord_status || 'offline');

    const acts = (d.activities || []).filter(a => a.type !== 2);
    const body = $('discordBody');

    if (acts.length) {
      const a = acts[0];
      let imgHtml = '<div class="activity-img">🎮</div>';

      if (a.assets?.large_image) {
        let src = a.assets.large_image;
        if (src.startsWith('mp:external/')) {
          src = 'https://media.discordapp.net/external/' + src.slice('mp:external/'.length);
        } else if (a.application_id) {
          src = `https://cdn.discordapp.com/app-assets/${a.application_id}/${src}.png`;
        }
        imgHtml = `<div class="activity-img"><img src="${src}" alt="" onerror="this.parentElement.textContent='🎮'"></div>`;
      }

      const detail = [a.details, a.state].filter(Boolean).join(' · ');
      body.innerHTML = `
        <div class="activity-row">
          ${imgHtml}
          <div class="activity-text">
            <div class="activity-name">${esc(a.name)}</div>
            ${detail ? `<div class="activity-detail">${esc(detail)}</div>` : ''}
          </div>
        </div>`;
    } else {
      const labels = { online: '🟢 Online', idle: '🟡 Idle', dnd: '🔴 Do Not Disturb', offline: '⚫ Offline' };
      body.innerHTML = `<p class="status-only">${labels[d.discord_status] || '⚫ Offline'}</p>`;
    }

    renderSpotify(d.spotify || null);
  }

  async function loadAvatar() {
    try {
      const r = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
      const j = await r.json();
      if (!j.success) return;
      const u = j.data.discord_user;
      if (!u?.avatar) return;
      const url = `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.webp?size=128`;
      $('avatar').innerHTML = `<img src="${url}" alt="Avatar">`;
    } catch (_) {}
  }

  function connect() {
    ws = new WebSocket('wss://api.lanyard.rest/socket');

    ws.onmessage = e => {
      const msg = JSON.parse(e.data);
      if (msg.op === 1) {
        clearInterval(hbTimer);
        hbTimer = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })), msg.d.heartbeat_interval);
        ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_USER_ID } }));
      } else if (msg.op === 0) {
        renderPresence(msg.d);
      }
    };

    ws.onclose = () => { clearInterval(hbTimer); setTimeout(connect, 5000); };
  }

  loadAvatar();
  connect();
</script>
</body>
</html>
